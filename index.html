<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الخريطة التفاعلية</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* ===== Summary Box ===== */
    .summary-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: #7a3fa0;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      width: 260px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .summary-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-weight: bold;
    }

    /* ===== Popup Style (زي ما عندك) ===== */
    .popup-card {
      width: 500px;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .popup-header {
      background: #7a3fa0;
      color: #fff;
      padding: 18px 12px;
      text-align: center;
    }

    .title-main {
      font-size: 36px;
      font-weight: bold;
    }

    .title-sub {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .popup-body {
      padding: 14px;
      font-size: 28px;
      color: #333;
    }

    .popup-row {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .popup-label {
      color: #7a3fa0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- ===== Summary Panel ===== -->
<div class="summary-box" id="summaryBox">
  <div class="summary-title">إجماليات المشروع</div>
  <div class="summary-row">
    <span>إجمالي الكمية</span>
    <span class="summary-value" id="totalQty">0</span>
  </div>
  <div class="summary-row">
    <span>إجمالي المنفذ</span>
    <span class="summary-value" id="doneQty">0</span>
  </div>
</div>

<div id="map"></div>

<script>
/* ===== الخريطة ===== */
const map = L.map('map').setView([21.30, 39.70], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* ===== ألوان الحالات ===== */
function getColorByStatus(status) {
  if (!status) return "#9e9e9e";
  status = status.trim();
  if (status === "جاري") return "#4caf50";
  if (status === "منتهي") return "#2196f3";
  if (status === "متوقف") return "#f44336";
  return "#9e9e9e";
}

/* ===== قراءة Google Sheet ===== */
const sheetURL =
"https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json";

fetch(sheetURL)
.then(res => res.text())
.then(text => {

  const js = JSON.parse(text.substring(47).slice(0, -2));
  const cols = js.table.cols.map(c => c.label);
  const sheetData = {};

  let totalSum = 0;
  let doneSum = 0;

  js.table.rows.forEach(r => {
    if (!r.c[0]) return;
    const id = String(r.c[0].v).trim();
    sheetData[id] = {};

    cols.forEach((c, i) => {
      const value = r.c[i] && r.c[i].v !== null ? r.c[i].v : "";
      sheetData[id][c] = value;

      if (c === "total_qty" && !isNaN(value)) totalSum += Number(value);
      if (c === "done_qty" && !isNaN(value)) doneSum += Number(value);
    });
  });

  /* ===== عرض الإجماليات ===== */
  document.getElementById("totalQty").innerText = totalSum.toLocaleString();
  document.getElementById("doneQty").innerText = doneSum.toLocaleString();

  /* ===== رسم الطرق ===== */
  fetch("https://sohaibabuserour-cyber.github.io/roads-map/ROADS.geojson")
  .then(r => r.json())
  .then(geojson => {

    const roadsLayer = L.geoJSON(geojson, {
      style: { weight: 3, fillOpacity: 0.5 },
      onEachFeature: function(feature, layer) {

        const roadId = String(feature.properties["Name"]).trim();
        const row = sheetData[roadId];
        if (!row) return;

        const color = getColorByStatus(row["status"]);
        layer.setStyle({ color, fillColor: color });

        let popupHtml = `
          <div class="popup-card">
            <div class="popup-header">
              <div class="title-main">مشروع ولي العهد 9‑ي</div>
              <div class="title-sub">بيانات الطرق</div>
            </div>
            <div class="popup-body">
        `;

        Object.keys(row).forEach(key => {
          popupHtml += `
            <div class="popup-row">
              <div class="popup-label">${key}</div>
              <div>${row[key]}</div>
            </div>
          `;
        });

        popupHtml += `
            </div>
          </div>
        `;

        layer.bindPopup(popupHtml);
      }
    }).addTo(map);

    map.fitBounds(roadsLayer.getBounds());
  });
});
</script>
</body>
</html>
