<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الخريطة التفاعلية</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* ===== Dashboard ===== */
    .summary-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: #7a3fa0;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .summary-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 2px solid rgba(255,255,255,0.4);
      padding-bottom: 6px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }
    .summary-row:last-child { border-bottom: none; }

    /* ===== Popup ===== */
    .popup-card {
      width: 420px;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    .popup-header {
      background: #7a3fa0;
      color: #fff;
      padding: 14px;
      text-align: center;
    }
    .title-main { font-size: 26px; font-weight: bold; }
    .title-sub { font-size: 20px; font-weight: bold; margin-top: 4px; }
    .popup-body { padding: 12px; font-size: 18px; }
    .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .popup-row:last-child { border-bottom: none; }
    .popup-label { font-weight: bold; color: #7a3fa0; }
  </style>
</head>

<body>

<!-- ===== Dashboard ===== -->
<div class="summary-box">
  <div class="summary-title">إجماليات الطرق</div>
  <div class="summary-row"><span>إجمالي الردم</span><span id="fillTotal">0</span></div>
  <div class="summary-row"><span>إجمالي القطع</span><span id="cutTotal">0</span></div>
  <div class="summary-row"><span>الردم المنفذ</span><span id="fillDone">0</span></div>
  <div class="summary-row"><span>القطع المنفذ</span><span id="cutDone">0</span></div>
</div>

<div id="map"></div>

<script>
/* ===== إنشاء الخريطة ===== */
const map = L.map('map', { zoomControl: false }).setView([21.30,39.70],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

/* ===== GPS Live ===== */
let userMarker = null;
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(p => {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker(
      [p.coords.latitude, p.coords.longitude],
      { radius:8, color:"#1e88e5", fillColor:"#2196f3", fillOpacity:1, weight:3 }
    ).addTo(map);
  });
}

/* ===== ألوان الحالة ===== */
function getColorByStatus(v){
  if(!v) return "#9e9e9e";
  v=v.trim();
  if(v==="جاري") return "#4caf50";
  if(v==="منتهي") return "#2196f3";
  if(v==="متوقف") return "#f44336";
  return "#9e9e9e";
}
function num(v){ return !isNaN(v)&&v!==""?Number(v):0; }

/* ===== دالة تحميل أي Sheet ===== */
function loadSheet(sheetURL, callback){
  fetch(sheetURL)
    .then(r=>r.text())
    .then(t=>{
      const js=JSON.parse(t.substring(47).slice(0,-2));
      const data={};

      js.table.rows.forEach(r=>{
        if(!r.c[0]) return;
        const id = String(r.c[0].v).trim();
        data[id]={};

        js.table.cols.forEach((c,i)=>{
          const key = c.label.trim().toUpperCase();
          data[id][key] = r.c[i] && r.c[i].v!==null ? r.c[i].v : "";
        });
      });

      callback(data);
    });
}

/* ===== روابط الشيتات ===== */
const ROADS_SHEET =
"https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json";

const BLOCKS_SHEET =
"https://docs.google.com/spreadsheets/d/1OSYpiZjdPfshQL7-KswuHynT2Kh15Qu8AvBV4SkURh0/gviz/tq?tqx=out:json";

/* ===== تحميل الطرق ===== */
loadSheet(ROADS_SHEET, function(roadsData){

  /* تجميع إجماليات الطرق */
  let fillTotal=0, cutTotal=0, fillDone=0, cutDone=0;

  Object.values(roadsData).forEach(r=>{
    fillTotal += num(r["FILL-TOTAL-QTY"]);
    cutTotal  += num(r["CUT-TOTAL-QTY"]);
    fillDone  += num(r["FILL-DONE-QTY"]);
    cutDone   += num(r["CUT-DONE-QTY"]);
  });

  document.getElementById("fillTotal").innerText = fillTotal.toLocaleString();
  document.getElementById("cutTotal").innerText  = cutTotal.toLocaleString();
  document.getElementById("fillDone").innerText  = fillDone.toLocaleString();
  document.getElementById("cutDone").innerText   = cutDone.toLocaleString();

  fetch("https://sohaibabuserour-cyber.github.io/roads-map/ROADS.geojson")
    .then(r=>r.json())
    .then(geo=>{
      L.geoJSON(geo,{
        onEachFeature:(f,l)=>{
          const row = roadsData[String(f.properties.ID)];
          if(!row) return;

          const color = getColorByStatus(row["STATUS"]);
          l.setStyle({color, fillColor:color, fillOpacity:0.5, weight:3});

          let html = `<div class="popup-card"><div class="popup-header">
            <div class="title-main">مشروع ولي العهد 9‑ي</div>
            <div class="title-sub">بيانات الطريق</div>
            </div><div class="popup-body">`;

          Object.keys(row).forEach(k=>{
            if(k==="ID") return;
            html += `<div class="popup-row"><div class="popup-label">${k}</div><div>${row[k]}</div></div>`;
          });

          l.bindPopup(html+"</div></div>");
        }
      }).addTo(map);
    });
});

/* ===== تحميل البلوكات ===== */
loadSheet(BLOCKS_SHEET, function(blocksData){

  fetch("https://sohaibabuserour-cyber.github.io/roads-map/BLOCKS.geojson")
    .then(r=>r.json())
    .then(geo=>{
      L.geoJSON(geo,{
        onEachFeature:(f,l)=>{
          const row = blocksData[String(f.properties.ID)];
          if(!row) return;

          const color = getColorByStatus(row["STATUS"]);
          l.setStyle({color, fillColor:color, fillOpacity:0.4, weight:2});

          let html = `<div class="popup-card"><div class="popup-header">
            <div class="title-main">مشروع ولي العهد 9‑ي</div>
            <div class="title-sub">بيانات البلوك</div>
            </div><div class="popup-body">`;

          Object.keys(row).forEach(k=>{
            if(k==="ID") return;
            html += `<div class="popup-row"><div class="popup-label">${k}</div><div>${row[k]}</div></div>`;
          });

          l.bindPopup(html+"</div></div>");
        }
      }).addTo(map);
    });
});
</script>

</body>
</html>
