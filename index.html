<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Map App</title>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    direction: rtl;
}

/* Login */
#loginScreen {
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    flex-direction: column;
    gap: 10px;
}

#loginScreen input {
    padding: 10px;
    width: 250px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

#loginScreen button {
    padding: 10px;
    width: 270px;
    border: none;
    background: #6a2d91;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

#loginError {
    color: red;
    font-size: 13px;
    display: none;
}

/* App */
#mainApp {
    display: none;
    height: 100vh;
}

/* Map */
#map {
    width: 100%;
    height: 100%;
}

</style>

</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <h3>تسجيل الدخول</h3>

    <input id="loginEmail" placeholder="البريد الإلكتروني">
    <input id="loginPassword" type="password" placeholder="كلمة المرور">

    <button id="loginBtn">دخول</button>

    <div id="loginLoading" style="display:none">جارٍ التحميل...</div>
    <div id="loginError"></div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
    <div id="map"></div>
</div>

<!-- SCRIPT -->
<script src="app.js"></script>

</body>
</html>
