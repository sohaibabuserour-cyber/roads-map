<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الخريطة التفاعلية</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* ===== Summary Box ===== */
    .summary-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: #7a3fa0;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .summary-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .summary-value { font-weight: bold; }

    /* ===== Popup ===== */
    .popup-card {
      width: 500px;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .popup-header {
      background: #7a3fa0;
      color: #fff;
      padding: 18px 12px;
      text-align: center;
    }

    .title-main {
      font-size: 36px;
      font-weight: bold;
    }

    .title-sub {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }

    .popup-body {
      padding: 14px;
      font-size: 26px;
      color: #333;
    }

    .popup-row {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .popup-label {
      color: #7a3fa0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- ===== Dashboard ===== -->
<div class="summary-box">
  <div class="summary-title">إجماليات المشروع</div>
  <div class="summary-row"><span>إجمالي الردم الكلي</span><span id="fillTotal">0</span></div>
  <div class="summary-row"><span>إجمالي القطع الكلي</span><span id="cutTotal">0</span></div>
  <div class="summary-row"><span>الردم المنفذ</span><span id="fillDone">0</span></div>
  <div class="summary-row"><span>القطع المنفذ</span><span id="cutDone">0</span></div>
  <div class="summary-row"><span>الردم المتبقي</span><span id="fillRemain">0</span></div>
  <div class="summary-row"><span>القطع المتبقي</span><span id="cutRemain">0</span></div>
</div>

<div id="map"></div>

<script>
const map = L.map('map').setView([21.30,39.70],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function num(v){ return !isNaN(v) && v!=="" ? Number(v) : 0; }

const sheetURL =
"https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json";

fetch(sheetURL)
.then(r=>r.text())
.then(t=>{
  const js = JSON.parse(t.substring(47).slice(0,-2));
  const cols = js.table.cols.map(c=>c.label);
  const data = {};

  let sums = {
    fillT:0, cutT:0, fillD:0, cutD:0, fillR:0, cutR:0
  };

  js.table.rows.forEach(r=>{
    if(!r.c[0]) return;
    const id = String(r.c[0].v);
    data[id]={};

    cols.forEach((c,i)=>{
      const v = r.c[i] && r.c[i].v!==null ? r.c[i].v : "";
      data[id][c]=v;

      if(c==="FILL-TOTAL-QTY") sums.fillT+=num(v);
      if(c==="CUT-TOTAL-QTY") sums.cutT+=num(v);
      if(c==="FILL-DONE-QTY") sums.fillD+=num(v);
      if(c==="CUT-DONE-QTY") sums.cutD+=num(v);
      if(c==="FILL-REMANING-QTY") sums.fillR+=num(v);
      if(c==="CUT-REMANING-QTY") sums.cutR+=num(v);
    });
  });

  document.getElementById("fillTotal").innerText=sums.fillT.toLocaleString();
  document.getElementById("cutTotal").innerText=sums.cutT.toLocaleString();
  document.getElementById("fillDone").innerText=sums.fillD.toLocaleString();
  document.getElementById("cutDone").innerText=sums.cutD.toLocaleString();
  document.getElementById("fillRemain").innerText=sums.fillR.toLocaleString();
  document.getElementById("cutRemain").innerText=sums.cutR.toLocaleString();

  fetch("https://sohaibabuserour-cyber.github.io/roads-map/ROADS.geojson")
  .then(r=>r.json())
  .then(geo=>{
    const layer=L.geoJSON(geo,{
      onEachFeature:(f,l)=>{
        const row=data[String(f.properties.Name)];
        if(!row) return;

        let html=`
        <div class="popup-card">
          <div class="popup-header">
            <div class="title-main">مشروع ولي العهد 9‑ي</div>
            <div class="title-sub">بيانات الطرق</div>
          </div>
          <div class="popup-body">`;

        Object.keys(row).forEach(k=>{
          html+=`
            <div class="popup-row">
              <div class="popup-label">${k}</div>
              <div>${row[k]}</div>
            </div>`;
        });

        l.bindPopup(html+"</div></div>");
      }
    }).addTo(map);

    map.fitBounds(layer.getBounds());
  });
});
</script>
</body>
</html>
``
