<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الخريطة التفاعلية</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }

    /* ===== Popup Style ===== */
    .popup-card {
      width: 300px;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .popup-header {
      background: #7a3fa0;
      color: #fff;
      padding: 14px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .popup-body {
      padding: 14px;
      font-size: 16px;
      color: #333;
    }

    .popup-row {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .popup-label {
      color: #7a3fa0;
      font-weight: bold;
    }

    .popup-value {
      color: #000;
      text-align: left;
    }
  </style>
</head>

<body>
<div id="map"></div>

<script>
/* ===== الخريطة ===== */
const map = L.map('map').setView([21.30, 39.70], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* ===== ألوان الحالات ===== */
function getColorByStatus(status) {
  if (!status) return "#9e9e9e"; // رمادي
  status = status.trim();
  if (status === "جاري") return "#4caf50";     // أخضر
  if (status === "منتهي") return "#2196f3";    // أزرق
  if (status === "متوقف") return "#f44336";    // أحمر
  return "#9e9e9e";
}

/* ===== قراءة Google Sheet ===== */
const sheetURL =
"https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json";

fetch(sheetURL)
.then(res => res.text())
.then(text => {

  const js = JSON.parse(text.substring(47).slice(0, -2));
  const cols = js.table.cols.map(c => c.label);
  const sheetData = {};

  js.table.rows.forEach(r => {
    if (!r.c[0]) return;  // لازم Name
    const id = String(r.c[0].v).trim();
    sheetData[id] = {};
    cols.forEach((c, i) => {
      sheetData[id][c] =
        r.c[i] && r.c[i].v !== null ? r.c[i].v : "";
    });
  });

  /* ===== رسم الطرق ===== */
  fetch("https://sohaibabuserour-cyber.github.io/roads-map/ROADS.geojson")
  .then(r => r.json())
  .then(geojson => {

    const roadsLayer = L.geoJSON(geojson, {
      style: {
        weight: 3,
        fillOpacity: 0.5
      },
      onEachFeature: function(feature, layer) {

        const roadId = String(feature.properties["Name"]).trim();
        const row = sheetData[roadId];

        if (!row) {
          layer.setStyle({
            color: "#9e9e9e",
            fillColor: "#9e9e9e"
          });
          layer.bindPopup("لا توجد بيانات لهذا الطريق");
          return;
        }

        const color = getColorByStatus(row["status"]);

        layer.setStyle({
          color: color,
          fillColor: color
        });

        /* ===== Popup ===== */
        let popupHtml = `
          <div class="popup-card">
            <div class="popup-header">
              مشروع ولي العهد 9‑ي
            </div>
            <div class="popup-body">
        `;

        Object.keys(row).forEach(key => {
          popupHtml += `
            <div class="popup-row">
              <div class="popup-label">${key}</div>
              <div class="popup-value">${row[key]}</div>
            </div>
          `;
        });

        popupHtml += `
            </div>
          </div>
        `;

        layer.bindPopup(popupHtml);
      }
    }).addTo(map);

    map.fitBounds(roadsLayer.getBounds());
  });
});
</script>
</body>
</html>
