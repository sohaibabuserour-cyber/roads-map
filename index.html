<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <title>Roads – Live from Google Sheet</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>

<body>
<div id="map"></div>

<script>
/* =========================
   1) إنشاء الخريطة
   ========================= */
const map = L.map('map').setView([21.30, 39.70], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* =========================
   2) تحميل الطرق أولًا (ثابت)
   ========================= */
fetch("ROADS.geojson")
  .then(r => r.json())
  .then(geojson => {

    const roadsLayer = L.geoJSON(geojson, {
      style: {
        color: "#0077ff",
        weight: 3,
        fill: true,
        fillColor: "#0077ff",
        fillOpacity: 0.35,
        opacity: 1
      },
      onEachFeature: function (feature, layer) {
        // popup احتياطي (لو الشيت فشل)
        layer.bindPopup(
          `<b>رقم الطريق:</b> ${feature.properties["Name"]}`
        );
      }
    }).addTo(map);

    map.fitBounds(roadsLayer.getBounds());

    /* =========================
       3) تحميل Google Sheet
       ========================= */
    const sheetURL =
      "https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json";

    fetch(sheetURL)
      .then(res => res.text())
      .then(text => {

        const js = JSON.parse(text.substring(47).slice(0, -2));

        // تحويل الشيت إلى object سهل
        const cols = js.table.cols.map(c => c.label);
        const sheetData = {};

        js.table.rows.forEach(r => {
          if (!r.c[0]) return;       // لازم Name
          const id = String(r.c[0].v).trim();
          sheetData[id] = {};
          cols.forEach((c, i) => {
            sheetData[id][c] =
              r.c[i] && r.c[i].v !== null ? r.c[i].v : "";
          });
        });

        /* =========================
           4) ربط الشيت بالطرق
           ========================= */
        roadsLayer.eachLayer(layer => {

          const roadId =
            String(layer.feature.properties["Name"]).trim();

          const row = sheetData[roadId];
          if (!row) return; // لو مفيش صف، سيب popup الاحتياطي

          let html = "<b>بيانات الطريق</b><hr>";
          Object.keys(row).forEach(k => {
            html += `<b>${k}:</b> ${row[k]}<br>`;
          });

          layer.bindPopup(html);
        });

      })
      .catch(err => {
        console.warn("فشل تحميل الشيت – الطرق ظلت ظاهرة", err);
      });

  })
  .catch(err => {
    alert("فشل تحميل ملف الطرق");
    console.error(err);
  });
</script>
</body>
</html>
