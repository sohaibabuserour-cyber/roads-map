<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخريطة التفاعلية مشروع ولى العهد ي</title>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
https://unpkg.com/leaflet@1.9.4/dist/leaflet.js>

<style>
body{margin:0;font-family:Arial}
#map{height:100vh}

/* ===== Control Panel ===== */
.control-box{
 position:absolute;top:12px;right:12px;z-index:1000;
 background:#fff;padding:10px 14px;border-radius:10px;
 box-shadow:0 4px 12px rgba(0,0,0,.3);
 font-size:14px
}

/* ===== Dashboards ===== */
.dashboard{
 position:absolute;left:12px;z-index:1000;width:300px;
 background:#7a3fa0;color:#fff;padding:14px;border-radius:14px;
 box-shadow:0 6px 16px rgba(0,0,0,.35);
 margin-bottom:12px
}
.dashboard h3{text-align:center;margin:0 0 8px;font-size:18px;border-bottom:1px solid rgba(255,255,255,.5)}
.row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.3)}
.row:last-child{border-bottom:none}

#roadsDash{top:60px}
#blocksDash{top:300px}

/* ===== Legend ===== */
.legend{
 position:absolute;bottom:20px;right:20px;
 background:#fff;padding:10px;border-radius:8px;
 box-shadow:0 4px 10px rgba(0,0,0,.3);
 font-size:14px
}
.legend span{display:flex;align-items:center;margin-bottom:5px}
.legend i{width:14px;height:14px;margin-left:8px;border-radius:3px}
.green{background:#4caf50}
.blue{background:#2196f3}
.red{background:#f44336}
</style>
</head>

<body>

<!-- ✅ Checkbox Control -->
<div class="control-box">
 <label><input id="chkRoads" type="checkbox" checked> الطرق</label><br>
 <label><input id="chkBlocks" type="checkbox" checked> البلوكات</label>
</div>

<!-- ✅ Dashboard Roads -->
<div class="dashboard" id="roadsDash">
<h3>إجماليات الطرق</h3>
<div class="row"><span>الردم الكلي</span><span id="rFillT">0</span></div>
<div class="row"><span>القطع الكلي</span><span id="rCutT">0</span></div>
<div class="row"><span>المنفذ</span><span id="rDone">0</span></div>
<div class="row"><span>المتبقي</span><span id="rRemain">0</span></div>
</div>

<!-- ✅ Dashboard Blocks -->
<div class="dashboard" id="blocksDash">
<h3>إجماليات البلوكات</h3>
<div class="row"><span>الردم الكلي</span><span id="bFillT">0</span></div>
<div class="row"><span>القطع الكلي</span><span id="bCutT">0</span></div>
<div class="row"><span>المنفذ</span><span id="bDone">0</span></div>
<div class="row"><span>المتبقي</span><span id="bRemain">0</span></div>
</div>

<div id="map"></div>

<!-- ✅ Legend -->
<div class="legend">
 <span><i class="green"></i>جاري</span>
 <span><i class="blue"></i>منتهي</span>
 <span><i class="red"></i>متوقف</span>
</div>

<script>
const map=L.map('map').setView([21.3,39.7],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let roadsLayer,blocksLayer;

function colorByStatus(s){
 if(!s)return"#999";
 if(s==="جاري")return"#4caf50";
 if(s==="منتهي")return"#2196f3";
 if(s==="متوقف")return"#f44336";
 return"#999";
}
function num(v){return !isNaN(v)&&v!==""?Number(v):0}

function loadSheet(url,cb){
 fetch(url).then(r=>r.text()).then(t=>{
  const j=JSON.parse(t.substring(47).slice(0,-2));
  let d={};j.table.rows.forEach(r=>{
   if(!r.c[0])return;
   let id=r.c[0].v;d[id]={};
   j.table.cols.forEach((c,i)=>{
    d[id][c.label.trim().toUpperCase()]=r.c[i]?.v||"";
   });
  });cb(d);
 });
}

/* ===== ROADS ===== */
loadSheet("https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json",data=>{
 let fT=0,cT=0,d=0,r=0;
 Object.values(data).forEach(v=>{
  fT+=num(v["FILL-TOTAL-QTY"]);
  cT+=num(v["CUT-TOTAL-QTY"]);
  d+=num(v["FILL-DONE-QTY"])+num(v["CUT-DONE-QTY"]);
  r+=num(v["FILL-REMANING-QTY"])+num(v["CUT-REMANING-QTY"]);
 });
 rFillT.textContent=fT;rCutT.textContent=cT;rDone.textContent=d;rRemain.textContent=r;

 fetch("ROADS.geojson").then(r=>r.json()).then(g=>{
  roadsLayer=L.geoJSON(g,{
   onEachFeature:(f,l)=>{
    let row=data[f.properties.ID];
    if(!row)return;
    let col=colorByStatus(row["STATUS"]);
    l.setStyle({color:col,fillColor:col,fillOpacity:.5});
   }
  }).addTo(map);
 });
});

/* ===== BLOCKS ===== */
loadSheet("https://docs.google.com/spreadsheets/d/1OSYpiZjdPfshQL7-KswuHynT2Kh15Qu8AvBV4SkURh0/gviz/tq?tqx=out:json",data=>{
 let fT=0,cT=0,d=0,r=0;
 Object.values(data).forEach(v=>{
  fT+=num(v["FILL-TOTAL-QTY"]);
  cT+=num(v["CUT-TOTAL-QTY"]);
  d+=num(v["FILL-DONE-QTY"])+num(v["CUT-DONE-QTY"]);
  r+=num(v["FILL-REMANING-QTY"])+num(v["CUT-REMANING-QTY"]);
 });
 bFillT.textContent=fT;bCutT.textContent=cT;bDone.textContent=d;bRemain.textContent=r;

 fetch("BLOCKS.geojson").then(r=>r.json()).then(g=>{
  blocksLayer=L.geoJSON(g,{
   onEachFeature:(f,l)=>{
    let row=data[f.properties.ID];
    if(!row)return;
    let col=colorByStatus(row["STATUS"]);
    l.setStyle({color:col,fillColor:col,fillOpacity:.4});
   }
  }).addTo(map);
 });
});

/* ===== Checkboxes ===== */
chkRoads.onchange=()=>this.checked?map.addLayer(roadsLayer):map.removeLayer(roadsLayer);
chkBlocks.onchange=()=>this.checked?map.addLayer(blocksLayer):map.removeLayer(blocksLayer);
</script>

</body>
</html>
