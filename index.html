<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الخريطة التفاعلية</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* ===== Dashboard ===== */
    .summary-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: #7a3fa0;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .summary-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 2px solid rgba(255,255,255,0.4);
      padding-bottom: 8px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }
    .summary-row:last-child { border-bottom: none; }
  </style>
</head>

<body>

<div class="summary-box">
  <div class="summary-title">إجماليات المشروع</div>
  <div class="summary-row"><span>إجمالي الردم الكلي</span><span id="fillTotal">0</span></div>
  <div class="summary-row"><span>إجمالي القطع الكلي</span><span id="cutTotal">0</span></div>
  <div class="summary-row"><span>الردم المنفذ</span><span id="fillDone">0</span></div>
  <div class="summary-row"><span>القطع المنفذ</span><span id="cutDone">0</span></div>
  <div class="summary-row"><span>الردم المتبقي</span><span id="fillRemain">0</span></div>
  <div class="summary-row"><span>القطع المتبقي</span><span id="cutRemain">0</span></div>
</div>

<div id="map"></div>

<script>
/* ==============================
   إنشاء الخريطة (بدون + / −)
   ============================== */
const map = L.map('map', { zoomControl: false }).setView([21.30, 39.70], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* ==============================
   تتبع الموقع Live (Google Maps style)
   ============================== */
let userMarker = null;

if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    function (position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (userMarker) {
        map.removeLayer(userMarker);
      }

      userMarker = L.circleMarker([lat, lng], {
        radius: 8,
        color: "#1e88e5",
        fillColor: "#2196f3",
        fillOpacity: 1,
        weight: 3
      }).addTo(map);
    },
    function (error) {
      console.warn("تعذر تحديد الموقع");
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
}

/* ==============================
   (باقي كود الطرق والشيت والداش
   تحطه زي ما هو عندك من غير تغيير)
   ============================== */
</script>

</body>
</html>
