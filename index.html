<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة التفاعلية مشروع ولي العهد</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f5f5}
#map{height:100vh;width:100%}

/* search */
.search-box{position:absolute;top:20px;right:20px;z-index:2000;background:#fff;padding:8px;border-radius:8px;width:200px}
.search-box input{width:100%;padding:8px}
.search-box-blocks{top:80px}

/* dash */
.dash-container{position:absolute;top:20px;left:12px;display:flex;flex-direction:column;gap:16px;z-index:1000}
.dashboard{width:320px;background:#7a3fa0;color:#fff;padding:14px;border-radius:14px}
.row{display:flex;justify-content:space-between;padding:5px 0}

/* right */
.right-panel{position:fixed;bottom:20px;right:20px;background:#fff;padding:10px;border-radius:10px}

/* popup */
.popup-card{width:450px;background:#fff;border-radius:16px}
.popup-header{background:#7a3fa0;color:#fff;padding:10px;text-align:center}
.popup-body{padding:10px}
.popup-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ddd}
</style>
</head>

<body>

<div class="dash-container">

<div class="dashboard" id="roadsDash">
<h3>إجماليات الطرق</h3>
<div class="row"><span>ردم</span><span id="rFillT">0</span></div>
<div class="row"><span>قطع</span><span id="rCutT">0</span></div>
<div class="row"><span>ردم منفذ</span><span id="rFillD">0</span></div>
<div class="row"><span>قطع منفذ</span><span id="rCutD">0</span></div>
<div class="row"><span>متبقي</span><span id="rFillR">0</span></div>
<div class="row"><span>متبقي</span><span id="rCutR">0</span></div>
</div>

<div class="dashboard" id="blocksDash">
<h3>إجماليات البلوكات</h3>
<div class="row"><span>ردم</span><span id="bFillT">0</span></div>
<div class="row"><span>قطع</span><span id="bCutT">0</span></div>
<div class="row"><span>ردم منفذ</span><span id="bFillD">0</span></div>
<div class="row"><span>قطع منفذ</span><span id="bCutD">0</span></div>
<div class="row"><span>متبقي</span><span id="bFillR">0</span></div>
<div class="row"><span>متبقي</span><span id="bCutR">0</span></div>
</div>

</div>

<div class="right-panel">
<label>طرق <input type="checkbox" id="chkRoads" checked></label>
<label>بلوكات <input type="checkbox" id="chkBlocks" checked></label>
</div>

<div class="search-box">
<input id="roadsSearchInput" placeholder="بحث طريق">
</div>

<div class="search-box search-box-blocks">
<input id="blocksSearchInput" placeholder="بحث بلوك">
</div>

<div id="map"></div>

<script>
const map=L.map('map').setView([21.3,39.7],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let roadsLayer,blocksLayer;
let roadsFeatures={},blocksFeatures={};

function num(v){return !isNaN(v)?Number(v):0}
function colorByStatus(s){
 if(s==="جاري")return"#4caf50";
 if(s==="متاح")return"#2196f3";
 if(s==="غير متاح")return"#ff9800";
 if(s==="تم الانتهاء")return"#9c27b0";
 if(s==="متوقف")return"#f44336";
 return"#999";
}

function loadSheet(url,cb){
 fetch(url).then(r=>r.text()).then(t=>{
  const j=JSON.parse(t.substring(47).slice(0,-2));
  let d={};
  j.table.rows.forEach(r=>{
   if(!r.c[0])return;
   let id=r.c[0].v;
   d[id]={};
   j.table.cols.forEach((c,i)=>{
    d[id][c.label.trim().toUpperCase()]=r.c[i]?.v||"";
   });
  });
  cb(d);
 });
}

/* ROADS */
loadSheet("https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json",data=>{

let fT=0,cT=0,fD=0,cD=0,fR=0,cR=0;
Object.values(data).forEach(v=>{
 fT+=num(v["FILL-TOTAL-QTY"]);
 cT+=num(v["CUT-TOTAL-QTY"]);
 fD+=num(v["FILL-DONE-QTY"]);
 cD+=num(v["CUT-DONE-QTY"]);
 fR+=num(v["FILL-REMANING-QTY"]);
 cR+=num(v["CUT-REMANING-QTY"]);
});

rFillT.textContent=fT;
rCutT.textContent=cT;
rFillD.textContent=fD;
rCutD.textContent=cD;
rFillR.textContent=fR;
rCutR.textContent=cR;

fetch("ROADS.geojson").then(r=>r.json()).then(g=>{
roadsLayer=L.geoJSON(g,{
 onEachFeature:(f,l)=>{
  let row=data[f.properties.ID];
  if(!row)return;

  roadsFeatures[row["ROAD NAME"]]=l;

  let col=colorByStatus(row["STATUS"]);
  l.setStyle({color:col});

  l.bindPopup(`<div class="popup-card"><div class="popup-header">${row["ROAD NAME"]}</div></div>`);
 }
}).addTo(map);
});
});

/* BLOCKS */
loadSheet("https://docs.google.com/spreadsheets/d/1OSYpiZjdPfshQL7-KswuHynT2Kh15Qu8AvBV4SkURh0/gviz/tq?tqx=out:json",data=>{

let fT=0,cT=0,fD=0,cD=0,fR=0,cR=0;
Object.values(data).forEach(v=>{
 fT+=num(v["FILL-TOTAL-QTY"]);
 cT+=num(v["CUT-TOTAL-QTY"]);
 fD+=num(v["FILL-DONE-QTY"]);
 cD+=num(v["CUT-DONE-QTY"]);
 fR+=num(v["FILL-REMANING-QTY"]);
 cR+=num(v["CUT-REMANING-QTY"]);
});

bFillT.textContent=fT;
bCutT.textContent=cT;
bFillD.textContent=fD;
bCutD.textContent=cD;
bFillR.textContent=fR;
bCutR.textContent=cR;

fetch("BLOCKS.geojson").then(r=>r.json()).then(g=>{
blocksLayer=L.geoJSON(g,{
 onEachFeature:(f,l)=>{
  let row=data[f.properties.ID];
  if(!row)return;

  blocksFeatures[row["BLOCK NAME"]]=l;

  let col=colorByStatus(row["STATUS"]);
  l.setStyle({color:col,fillColor:col,fillOpacity:.4});

  l.bindPopup(`<div class="popup-card"><div class="popup-header">${row["BLOCK NAME"]}</div></div>`);
 }
}).addTo(map);
});
});

</script>

</body>
</html>
