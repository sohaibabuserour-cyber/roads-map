<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخريطة التفاعلية مشروع ولي العهد ي</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial}
#map{height:100vh}

/* ===== Dashboards ===== */
.dashboard{
 position:absolute;left:12px;width:320px;
 background:#7a3fa0;color:#fff;
 padding:14px;border-radius:14px;
 box-shadow:0 6px 16px rgba(0,0,0,.35);
 z-index:1000
}
.dashboard h3{
 text-align:center;margin:0 0 8px;
 font-size:24px;border-bottom:1px solid rgba(255,255,255,.5)
}
.row{
 display:flex;justify-content:space-between;
 font-size:20px;padding:4px 0;
 border-bottom:1px solid rgba(255,255,255,.3)
}
.row:last-child{border-bottom:none}

#roadsDash{top:20px}
#blocksDash{top:320px}

/* ===== Right Panel ===== */
.right-panel{
 position:fixed;bottom:20px;right:20px;
 background:#fff;padding:10px 12px;
 border-radius:10px;width:170px;
 box-shadow:0 4px 12px rgba(0,0,0,.35);
 font-size:24px;z-index:2000
}
 .layer-toggle input[type="checkbox"]{
    width: 20px;
    height: 20px;
    transform: scale(1.4); /* تكبير إضافي */
    margin-left: 6px;
    cursor: pointer;
}

.layer-toggle{margin-bottom:10px;border-bottom:1px solid #ddd;padding-bottom:8px}
.layer-toggle label{display:block;margin-bottom:6px;cursor:pointer}

.legend-item{display:flex;align-items:center;margin-bottom:6px}
.legend-color{width:20px;height:20px;margin-left:8px;border-radius:4px}
.green{background:#4caf50}
.blue{background:#2196f3}
.red{background:#f44336}

/* ===== Popup Style ===== */
.popup-card{
 width:480px;border-radius:16px;overflow:hidden;
 background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)
}
.popup-header{
 background:#7a3fa0;color:#fff;padding:16px;text-align:center
}
.title-main{font-size:28px;font-weight:bold}
.title-sub{font-size:20px;font-weight:bold;margin-top:4px}
.popup-body{padding:12px;font-size:20px;color:#333}
.popup-row{
 padding:6px 0;display:flex;justify-content:space-between;
 border-bottom:2px solid #e0e0e0
}
.popup-row:last-child{border-bottom:none}
.popup-label{color:#7a3fa0;font-weight:bold}
</style>
</head>

<body>

<div class="dashboard" id="roadsDash">
<h3>إجماليات الطرق</h3>
<div class="row"><span>إجمالي كمية الردم</span><span id="bFillT">0</span></div>
<div class="row"><span>إجمالى كمية القطع</span><span id="bCutT">0</span></div>
<div class="row"><span>كمية الردم المنفذة</span><span id="bFillD">0</span></div>
<div class="row"><span>كمية القطع المنفذة</span><span id="bCutD">0</span></div>
<div class="row"><span>كمية الردم المتبقيه</span><span id="bFillR">0</span></div>
<div class="row"><span>كمية القطع المتبقية</span><span id="bCutR">0</span></div>
</div>

<div class="dashboard" id="blocksDash">
<h3>إجماليات البلوكات</h3>
<div class="row"><span>إجمالي كمية الردم</span><span id="bFillT">0</span></div>
<div class="row"><span>إجمالى كمية القطع</span><span id="bCutT">0</span></div>
<div class="row"><span>كمية الردم المنفذة</span><span id="bFillD">0</span></div>
<div class="row"><span>كمية القطع المنفذة</span><span id="bCutD">0</span></div>
<div class="row"><span>كمية الردم المتبقيه</span><span id="bFillR">0</span></div>
<div class="row"><span>كمية القطع المتبقية</span><span id="bCutR">0</span></div>
</div>

<div class="right-panel">
<div class="layer-toggle">
<label><input type="checkbox" id="chkRoads" checked> الطرق</label>
<label><input type="checkbox" id="chkBlocks" checked> البلوكات</label>
</div>
<div class="legend">
<div class="legend-item"><div class="legend-color green"></div>جاري</div>
<div class="legend-item"><div class="legend-color blue"></div>منتهي</div>
<div class="legend-item"><div class="legend-color red"></div>متوقف</div>
</div>
</div>

<div id="map"></div>

<script>
/* ===== إنشاء الخريطة ===== */
const map = L.map('map', { zoomControl: false }).setView([21.30, 39.70], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

/* ===== تتبع الموقع Live ===== */
let userMarker=null;
if("geolocation" in navigator){
  navigator.geolocation.watchPosition(pos=>{
    if(userMarker) map.removeLayer(userMarker);
    userMarker=L.circleMarker([pos.coords.latitude,pos.coords.longitude],{
      radius:8,color:"#1e88e5",fillColor:"#2196f3",fillOpacity:1,weight:3
    }).addTo(map);
  });
}


let roadsLayer,blocksLayer;

function num(v){return !isNaN(v)&&v!==""?Number(v):0}
function colorByStatus(s){
 if(s==="جاري")return"#4caf50";
 if(s==="منتهي")return"#2196f3";
 if(s==="متوقف")return"#f44336";
 return"#9e9e9e"
}

function loadSheet(url,cb){
 fetch(url).then(r=>r.text()).then(t=>{
  const j=JSON.parse(t.substring(47).slice(0,-2));
  let d={};
  j.table.rows.forEach(r=>{
   if(!r.c[0])return;
   let id=String(r.c[0].v);
   d[id]={};
   j.table.cols.forEach((c,i)=>{
    d[id][c.label.trim().toUpperCase()]=r.c[i]?.v||"";
   });
  });
  cb(d);
 });
}

/* ===== ROADS ===== */
loadSheet("https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json",data=>{
 let fT=0,cT=0,fD=0,cD=0,fR=0,cR=0;
 Object.values(data).forEach(v=>{
  fT+=num(v["FILL-TOTAL-QTY"]);
  cT+=num(v["CUT-TOTAL-QTY"]);
  fD+=num(v["FILL-DONE-QTY"]);
  cD+=num(v["CUT-DONE-QTY"]);
  fR+=num(v["FILL-REMANING-QTY"]);
  cR+=num(v["CUT-REMANING-QTY"]);
 });
 rFillT.textContent=fT;
 rCutT.textContent=cT;
 rFillD.textContent=fD;
 rCutD.textContent=cD;
 rFillR.textContent=fR;
 rCutR.textContent=cR;

 fetch("ROADS.geojson").then(r=>r.json()).then(g=>{
  roadsLayer=L.geoJSON(g,{
   onEachFeature:(f,l)=>{
    let row=data[f.properties.ID];if(!row)return;
    let col=colorByStatus(row["STATUS"]);
    l.setStyle({color:col,fillColor:col,fillOpacity:.5});
    let html=`
    <div class="popup-card">
      <div class="popup-header">
        <div class="title-main">مشروع ولي العهد ي</div>
        <div class="title-sub">بيانات الطريق</div>
      </div>
      <div class="popup-body">`;
    Object.keys(row).forEach(k=>{
      if(k==="ID")return;
      html+=`<div class="popup-row"><div class="popup-label">${k}</div><div>${row[k]}</div></div>`;
    });
    l.bindPopup(html+"</div></div>");
    l.on('click',()=>l.openPopup());
   }
  }).addTo(map);
 });
});

/* ===== BLOCKS ===== */
loadSheet("https://docs.google.com/spreadsheets/d/1OSYpiZjdPfshQL7-KswuHynT2Kh15Qu8AvBV4SkURh0/gviz/tq?tqx=out:json",data=>{
 let fT=0,cT=0,fD=0,cD=0,fR=0,cR=0;
 Object.values(data).forEach(v=>{
  fT+=num(v["FILL-TOTAL-QTY"]);
  cT+=num(v["CUT-TOTAL-QTY"]);
  fD+=num(v["FILL-DONE-QTY"]);
  cD+=num(v["CUT-DONE-QTY"]);
  fR+=num(v["FILL-REMANING-QTY"]);
  cR+=num(v["CUT-REMANING-QTY"]);
 });
 bFillT.textContent=fT;
 bCutT.textContent=cT;
 bFillD.textContent=fD;
 bCutD.textContent=cD;
 bFillR.textContent=fR;
 bCutR.textContent=cR;

 fetch("BLOCKS.geojson").then(r=>r.json()).then(g=>{
  blocksLayer=L.geoJSON(g,{
   onEachFeature:(f,l)=>{
    let row=data[f.properties.ID];if(!row)return;
    let col=colorByStatus(row["STATUS"]);
    l.setStyle({color:col,fillColor:col,fillOpacity:.4});
    let html=`
    <div class="popup-card">
      <div class="popup-header">
        <div class="title-main">مشروع ولي العهد ي</div>
        <div class="title-sub">بيانات البلوك</div>
      </div>
      <div class="popup-body">`;
    Object.keys(row).forEach(k=>{
      if(k==="ID")return;
      html+=`<div class="popup-row"><div class="popup-label">${k}</div><div>${row[k]}</div></div>`;
    });
    l.bindPopup(html+"</div></div>");
    l.on('click',()=>l.openPopup());
   }
  }).addTo(map);
 });
});

chkRoads.onchange=function(){this.checked?map.addLayer(roadsLayer):map.removeLayer(roadsLayer)}
chkBlocks.onchange=function(){this.checked?map.addLayer(blocksLayer):map.removeLayer(blocksLayer)}
</script>

</body>
</html>
