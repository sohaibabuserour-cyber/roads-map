<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>الخريطة التفاعلية - مشروع ولي العهد</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

    <style>
        /* ========== THEMES ========== */
        :root {
            --purple:      #6a2d91;
            --purple-mid:  #8b44b8;
            --purple-light:#b47fd4;
            --gold:        #f5c842;
            --bg:          #f0edf5;
            --white:       #ffffff;
            --border:      #d8cfe8;
            --text:        #2a1a40;
            --text-soft:   #7a6590;
            --green:       #3aaa5c;
            --blue:        #2196f3;
            --orange:      #ff9800;
            --red:         #f44336;
            --violet:      #9c27b0;
            --topbar-bg:   linear-gradient(135deg,#1a0a2e 0%,#3d1060 100%);
            --sidebar-hdr-bg: linear-gradient(135deg,#6a2d91 0%,#8b44b8 100%);
        }

        body.theme-ocean {
            --purple:      #0d5c8a; --purple-mid:  #1a7bbf; --purple-light:#5baddf; --gold: #f0c040;
            --bg:          #e8f4fd; --border:      #b8d8f0; --text:        #0a2a40; --text-soft: #4a7a9a;
            --topbar-bg:   linear-gradient(135deg,#042a45 0%,#0d5c8a 100%);
            --sidebar-hdr-bg: linear-gradient(135deg,#0d5c8a 0%,#1a7bbf 100%);
        }
        body.theme-dark {
            --purple:      #9b59b6; --purple-mid:  #8e44ad; --purple-light:#c39bd3; --gold: #f1c40f;
            --bg:          #1a1a2e; --white:       #242440; --border:      #3a3a5c; --text: #e0e0ff;
            --text-soft:   #9090bb; --green:       #27ae60;
            --topbar-bg:   linear-gradient(135deg,#0d0d20 0%,#1a1a3e 100%);
            --sidebar-hdr-bg: linear-gradient(135deg,#2d1b4e 0%,#4a2572 100%);
        }
        body.theme-emerald {
            --purple:      #1a7a4a; --purple-mid:  #27ae6a; --purple-light:#5cc890; --gold: #f5a623;
            --bg:          #e8f8f0; --border:      #b0dfc8; --text:        #0a2a1a; --text-soft: #4a8a6a;
            --topbar-bg:   linear-gradient(135deg,#0a2a1a 0%,#1a6040 100%);
            --sidebar-hdr-bg: linear-gradient(135deg,#1a7a4a 0%,#27ae6a 100%);
        }
        body.theme-sunset {
            --purple:      #c0392b; --purple-mid:  #e74c3c; --purple-light:#f1948a; --gold: #f39c12;
            --bg:          #fef5ec; --border:      #f5cba7; --text:        #4a1a0a; --text-soft: #9a6a5a;
            --topbar-bg:   linear-gradient(135deg,#4a1a0a 0%,#922b21 100%);
            --sidebar-hdr-bg: linear-gradient(135deg,#c0392b 0%,#e74c3c 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); height: 100vh; overflow: hidden; color: var(--text); }
        
        /* Add basic functional styles that were provided */
        #loginScreen { position: fixed; inset: 0; z-index: 99999; background: linear-gradient(135deg, #1a0a2e 0%, #3d1060 50%, #1a0a2e 100%); display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-bg-pattern { position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 20%, rgba(106,45,145,0.4) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(139,68,184,0.3) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(245,200,66,0.05) 0%, transparent 60%); pointer-events: none; }
        .login-box { position: relative; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 36px 44px; width: 380px; max-width: 95vw; backdrop-filter: blur(20px); box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); animation: loginFadeIn 0.6s ease-out; }
        @keyframes loginFadeIn { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo img.logo-img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(245,200,66,0.5)); animation: crownPulse 2.5s ease-in-out infinite; }
        .login-logo .crown-fallback { font-size: 44px; display: block; filter: drop-shadow(0 0 20px rgba(245,200,66,0.6)); animation: crownPulse 2.5s ease-in-out infinite; }
        @keyframes crownPulse { 0%, 100% { filter: drop-shadow(0 0 15px rgba(245,200,66,0.5)); } 50% { filter: drop-shadow(0 0 30px rgba(245,200,66,0.9)); } }
        .login-logo h1 { font-size: 17px; font-weight: 900; color: var(--gold); margin-top: 10px; }
        .login-logo p { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }
        .form-field { margin-bottom: 14px; }
        .form-field label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
        .form-field input { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15); border-radius: 9px; font-size: 14px; font-family: 'Cairo', sans-serif; color: white; outline: none; transition: all 0.3s ease; text-align: right; }
        .form-field input::placeholder { color: rgba(255,255,255,0.3); }
        .form-field input:focus { border-color: var(--gold); background: rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(245,200,66,0.15); }
        .login-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #6a2d91 0%, #8b44b8 100%); border: none; border-radius: 9px; color: white; font-size: 15px; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; margin-top: 6px; transition: all 0.3s ease; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(106,45,145,0.5); }
        .login-error { background: rgba(244,67,54,0.15); border: 1px solid rgba(244,67,54,0.4); color: #ff8a80; border-radius: 8px; padding: 9px 12px; font-size: 12px; font-weight: 600; text-align: center; margin-top: 12px; display: none; }
        .login-loading { text-align: center; color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 10px; display: none; }
        .login-loading .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin: 0 3px; animation: dotBounce 1.2s ease-in-out infinite; }
        .login-loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .login-loading .dot:nth-child(3) { animation-delay: 0.4s; }

        /* Rest of UI styles */
        #mainApp { display: none; width: 100%; height: 100vh; flex-direction: column; }
        #mainApp.visible { display: flex; }
        .top-nav { width: 100%; background: var(--topbar-bg); color: white; display: flex; align-items: center; flex-shrink: 0; height: 58px; padding: 0 16px; gap: 0; position: relative; z-index: 2000; box-shadow: 0 1px 0 rgba(255,255,255,0.06), 0 4px 24px rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.07); }
        .top-nav::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, rgba(245,200,66,0.4) 70%, transparent 100%); opacity: 0.7; }
        .nav-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: 20px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.1); }
        .nav-logo img { height: 40px; width: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(245,200,66,0.5)); }
        .nav-logo .logo-fallback { font-size: 26px; }
        .nav-logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .nav-logo-title { font-size: 13px; font-weight: 900; color: white; white-space: nowrap; letter-spacing: 0.3px; }
        .nav-logo-sub { font-size: 9px; color: rgba(255,255,255,0.45); font-weight: 600; white-space: nowrap; letter-spacing: 0.5px; }
        .nav-tabs { display: flex; gap: 1px; flex: 1; height: 100%; overflow-x: auto; overflow-y: visible; align-items: center; padding: 0 8px; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 16px; height: calc(100% - 8px); font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.2s ease; border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0; border-radius: 8px; }
        .nav-tab:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); }
        .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(245,200,66,0.08); border-radius: 8px 8px 0 0; }
        .nav-tab .tab-sub-dropdown { position: fixed; top: 58px; min-width: 210px; background: white; border-radius: 0 0 12px 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.06); display: none; flex-direction: column; z-index: 99999; border-top: 2px solid var(--purple); overflow: hidden; max-height: 420px; overflow-y: auto; }
        .tab-sub-item { padding: 10px 16px; font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s ease; border-bottom: 1px solid rgba(0,0,0,0.05); flex-direction: row-reverse; justify-content: flex-end; }
        .tab-sub-item:last-child { border-bottom: none; }
        .tab-sub-item:hover { background: rgba(106,45,145,0.06); }
        .tab-sub-item label { flex: 1; cursor: pointer; text-align: right; font-size: 12px; font-weight: 600; color: var(--text); }
        .nav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 0 6px; }
        .nav-right-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.12); margin: 0 4px; flex-shrink: 0; }
        .nav-right-group { display: flex; align-items: center; gap: 2px; padding: 3px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.07); }
        .nav-icon-btn { position: relative; background: transparent; border: none; color: rgba(255,255,255,0.7); width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.18s ease; }
        .nav-icon-btn:hover { background: rgba(255,255,255,0.12); color: white; transform: translateY(-1px); }
        .main-content { display: flex; flex: 1; min-height: 0; overflow: hidden; align-items: stretch; }
        .left-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        .stats-search-bar { width: 100%; background: white; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; z-index: 100; }
        .stats-row { display: flex; align-items: center; padding: 8px 14px; gap: 10px; overflow-x: auto; }
        .stats-row::-webkit-scrollbar { height: 3px; }
        .stats-row::-webkit-scrollbar-thumb { background: var(--purple-light); border-radius: 10px; }
        .search-row { padding: 6px 14px; border-top: 1px solid var(--border); background: #fafafa; display: flex; align-items: center; gap: 10px; }
        .search-wrap { flex-shrink: 0; position: relative; }
        .search-input { padding: 7px 32px 7px 12px; font-size: 13px; border-radius: 6px; border: 1.5px solid var(--border); outline: none; transition: all 0.3s ease; font-family: 'Cairo', sans-serif; color: var(--text); background: white; text-align: right; width: 100%; }
        .search-icon { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.45; pointer-events: none; }
        #map { flex: 1; width: 100%; min-height: 0; z-index: 10; }
        .right-sidebar { width: 235px; background: var(--white); border-right: 2px solid var(--border); box-shadow: 4px 0 16px rgba(106,45,145,0.08); display: flex; flex-direction: column; z-index: 1000; overflow: hidden; flex-shrink: 0; align-self: stretch; }
        .sidebar-header { padding: 10px 12px; background: var(--sidebar-hdr-bg); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .sidebar-header-title { font-size: 12px; font-weight: 700; color: white; }
        .admin-btns { display: flex; gap: 4px; align-items: center; }
        .hdr-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 10px; font-family: 'Cairo', sans-serif; font-weight: 700; transition: all 0.2s ease; white-space: nowrap; }
        .items-section { flex: 1; overflow-y: auto; overflow-x: hidden; border-bottom: 2px solid var(--border); min-height: 0; }

        /* Shared modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-box { background: var(--white); border-radius: 14px; padding: 26px; width: min(460px, 92vw); box-shadow: 0 16px 50px rgba(0,0,0,0.3); animation: modalPop 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .modal-title { font-size: 15px; font-weight: 900; color: var(--text); margin-bottom: 16px; text-align: right; }
        .btn-primary { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-mid) 100%); color: white; }

        /* Cashflow / Equipment complex modlas */
        .bd-modal-overlay { position: fixed; inset: 0; background: rgba(10,5,20,0.75); backdrop-filter: blur(6px); z-index: 1; }
        .cf-close-btn { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.18s ease; flex-shrink: 0; }
        @keyframes cfSlideIn { from { opacity:0; transform:translateY(24px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        .eq-form-input { width: 100%; padding: 10px 13px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 9px; color: white; font-size: 13px; font-family: 'Cairo', sans-serif; outline: none; transition: all 0.2s ease; text-align: right; }
        .eq-form-input:focus { border-color: rgba(39,174,106,0.6); background: rgba(255,255,255,0.09); box-shadow: 0 0 0 3px rgba(39,174,106,0.12); }
        .alert { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px; z-index: 99998; font-weight: 700; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); animation: alertPop 0.3s ease-out; white-space: nowrap; }
        .alert-error { background: var(--red); color: white; }
        .alert-success { background: var(--green); color: white; }
        @keyframes alertPop { from { opacity: 0; transform: translateX(-50%) translateY(-12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        /* Add standard popup mapping / utilities back */
        .popup-card { width: min(300px, 90vw); border-radius: 12px; overflow: hidden; background: white; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
        .popup-header { background: linear-gradient(135deg, #6a2d91 0%, #8b44b8 100%); color: white; padding: 11px 13px; text-align: center; }
        .popup-title { font-size: 14px; font-weight: 900; }
        .popup-subtitle { font-size: 12px; font-weight: 600; opacity: 0.85; margin-top: 2px; }
        .popup-body { padding: 10px 12px; max-height: 50vh; overflow-y: auto; }
        .popup-row { padding: 6px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border-bottom: 1px solid #f0f0f0; align-items: center; }
        .popup-label { color: #6a2d91; font-weight: 700; font-size: 11px; text-align: right; }
        .popup-value { font-weight: 600; color: var(--text); font-size: 11px; text-align: left; word-break: break-word; }
        
        .bunood-main-dd { position: fixed; top: 58px; min-width: 230px; background: white; border-radius: 0 0 12px 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.06); display: none; flex-direction: column; z-index: 99999; border-top: 2px solid var(--purple); overflow: hidden; max-height: 80vh; overflow-y: auto; }
        .bunood-sub-flyout { position: fixed; min-width: 220px; max-width: 280px; background: white; border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,0.2), 0 0 0 1px rgba(106,45,145,0.15); display: none; flex-direction: column; z-index: 100000; border-top: 2px solid var(--purple); overflow: hidden; max-height: 70vh; overflow-y: auto; }
        .bunood-cat-row { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.05); transition: background 0.15s ease; position: relative; }
        .bunood-cat-label { font-size: 12px; font-weight: 700; color: var(--text); flex: 1; text-align: right; display: flex; align-items: center; gap: 4px; flex-direction: row-reverse; }
        .legend-section { flex-shrink: 0; padding: 8px 10px; background: #fafafa; border-top: 2px solid var(--border); }
        .legend-item { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
        .legend-color { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .legend-label { flex: 1; font-size: 10px; font-weight: 600; text-align: right; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-bg-pattern"></div>
    <div class="login-box">
        <div class="login-logo">
            <span class="crown-fallback" id="loginLogoFallback">👑</span>
            <h1>مشروع ولي العهد</h1>
            <p>الخريطة التفاعلية لمتابعة التنفيذ</p>
        </div>
        <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="example@email.com" autocomplete="username">
        </div>
        <div class="form-field">
            <label>كلمة المرور</label>
            <div style="position:relative">
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" style="padding-left:38px">
                <button type="button" id="togglePassword" onclick="togglePasswordVisibility()" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;opacity:0.6;padding:4px;">👁️</button>
            </div>
        </div>
        <button class="login-btn" id="loginBtn" onclick="doLogin()">دخول</button>
        <div class="login-error" id="loginError">بيانات الدخول غير صحيحة</div>
        <div class="login-loading" id="loginLoading">جاري التحقق<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
    <!-- TOP NAV BAR -->
    <div class="top-nav">
        <div class="nav-logo">
            <span class="logo-fallback" id="navLogoFallback">👑</span>
        </div>
        <div class="nav-tab" id="navTabReports" style="flex-shrink:0;position:relative;" onclick="toggleReportsDropdown(event)">
            <span>📋 التقارير</span>
            <div class="tab-sub-dropdown" id="reportsDropdown" style="min-width:200px;">
                <div class="tab-sub-item" onclick="openEquipmentFormModal();closeReportsDropdown()"><span style="font-size:14px;">➕</span><label>تسجيل معدات</label></div>
            </div>
        </div>
        <div class="nav-tab" id="navTabAdd" style="flex-shrink:0;position:relative;" onclick="toggleAddDropdown(event)">
            <span>✏️ إضافة</span>
            <div class="tab-sub-dropdown" id="addDropdown" style="min-width:220px;">
                <div class="tab-sub-item" onclick="openContractorCashflowForm();closeAddDropdown()"><span style="font-size:14px;">👷</span><label>تدفق نقدي - المقاولون</label></div>
            </div>
        </div>
        <div class="nav-tabs" id="navTabs"></div>
        <div class="nav-right">
            <!-- Simplified standard tools -->
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="left-section">
            <div class="stats-search-bar">
                <div class="stats-row"><div class="stats-wrapper" id="statsWrapper"></div></div>
                <div class="search-row">
                    <div class="search-wrap" style="flex:1;position:relative">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-input" id="searchInput" placeholder="ابحث بالاسم...">
                        <div class="search-dropdown" id="searchDropdown"></div>
                    </div>
                </div>
            </div>
            <div id="map"></div>
        </div>
        <div class="right-sidebar">
            <div class="sidebar-header"><div class="sidebar-header-title">📋 البنود</div></div>
            <div class="items-section" id="itemsSection"></div>
            <div class="legend-section">
                <!-- Legends -->
            </div>
        </div>
    </div>
</div>

<!-- ==================== MODAL: CONTRACTOR CASHFLOW FORM ==================== -->
<div class="modal" id="contractorCashflowModal" style="z-index:65001;padding:20px;align-items:center;justify-content:center;">
    <div class="bd-modal-overlay" onclick="closeContractorCashflowForm()" style="position:fixed;inset:0;"></div>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;width:min(580px,96vw);max-height:calc(100vh - 40px);background:#0d0d1a;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.07);box-shadow:0 32px 80px rgba(0,0,0,0.7);animation:cfSlideIn 0.28s cubic-bezier(0.34,1.2,0.64,1);">

        <div style="background:linear-gradient(135deg,#1a0a2e 0%,#4a1a6e 50%,#1a0a2e 100%);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;">
            <div style="display:flex;align-items:center;gap:14px;">
                <div style="width:44px;height:44px;background:linear-gradient(135deg,#f5c842,#e8a800);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;">👷</div>
                <div>
                    <div style="font-size:17px;font-weight:900;color:white;font-family:'Cairo',sans-serif;">تسجيل تدفق نقدي — المقاول</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;font-family:'Cairo',sans-serif;">إضافة مستخلص مقاول جديد</div>
                </div>
            </div>
            <button class="cf-close-btn" onclick="closeContractorCashflowForm()">✕</button>
        </div>

        <div style="flex:1;overflow-y:auto;padding:24px;">
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:7px;font-family:'Cairo',sans-serif;">👷 المقاول</label>
                <select id="concf_contractor_select" class="eq-form-input" style="width:100%;cursor:pointer;" onchange="concfSyncContractor(this.value)"></select>
                <input type="hidden" id="concf_contractor">
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:7px;font-family:'Cairo',sans-serif;">📄 رقم المستخلص</label>
                    <input type="text" id="concf_statement_no" class="eq-form-input" readonly style="cursor:not-allowed;opacity:0.75;background:rgba(255,255,255,0.03);" title="رقم يعتمد على المقاول">
                </div>
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:7px;font-family:'Cairo',sans-serif;">📅 تاريخ المستخلص</label>
                    <input type="date" id="concf_date" class="eq-form-input">
                </div>
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:7px;font-family:'Cairo',sans-serif;">📊 المستحق صرفه (ريال)</label>
                <input type="text" id="concf_total" placeholder="0.00" class="eq-form-input" oninput="concfUpdatePreview()">
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:7px;font-family:'Cairo',sans-serif;">✅ المنصرف سابقا (ريال)</label>
                <input type="text" id="concf_spent" placeholder="0.00" class="eq-form-input" oninput="concfUpdatePreview()">
            </div>

            <div id="concf_preview" style="display:none;padding:14px 18px;background:rgba(106,45,145,0.1);border:1px solid rgba(106,45,145,0.3);border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center;">
                <div><div style="font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:4px;">المستحق</div><div style="font-size:16px;color:#f5c842;" id="concf_prev_total">—</div></div>
                <div><div style="font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:4px;">المنصرف</div><div style="font-size:16px;color:#5cc890;" id="concf_prev_spent">—</div></div>
                <div><div style="font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:4px;">المتبقي</div><div style="font-size:16px;color:#5baddf;" id="concf_prev_remaining">—</div></div>
            </div>

            <div style="margin-bottom:20px;">
                <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:7px;font-family:'Cairo',sans-serif;">📝 ملاحظات</label>
                <textarea id="concf_notes" rows="3" class="eq-form-input" style="resize:vertical;"></textarea>
            </div>

            <div id="concf_history_panel" style="display:none;margin-bottom:16px;border:1px solid rgba(245,200,66,0.3);border-radius:10px;overflow:hidden;">
                <div style="background:rgba(245,200,66,0.1);padding:9px 14px;color:#f5c842;font-size:12px;font-weight:700;">📋 مستخلصات المقاول — انقر لتعديل</div>
                <div id="concf_history_list" style="max-height:200px;overflow-y:auto;"></div>
            </div>

            <div id="concf_edit_badge" style="display:none;padding:8px 14px;background:rgba(245,200,66,0.1);border:1px solid rgba(245,200,66,0.35);border-radius:8px;margin-bottom:12px;align-items:center;gap:8px;">
                <span style="font-size:12px;color:#f5c842;">وضع التعديل</span>
                <button onclick="concfReset(true)" style="background:none;border:1px solid rgba(245,200,66,0.4);color:rgba(245,200,66,0.8);padding:3px 9px;border-radius:6px;cursor:pointer;">إلغاء التعديل</button>
            </div>

            <div id="concf_feedback" style="display:none;padding:12px 16px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:8px;"></div>
        </div>

        <div style="background:rgba(0,0,0,0.25);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,0.05);flex-shrink:0;">
            <button onclick="concfReset()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);padding:9px 18px;border-radius:8px;cursor:pointer;">إعادة تعيين</button>
            <div style="display:flex;gap:10px;">
                <button onclick="concfSubmit()" id="concf_submit_btn" style="background:linear-gradient(135deg,#f5c842,#e8a800);border:none;color:#1a0a2e;padding:11px 28px;border-radius:10px;font-weight:900;cursor:pointer;">💾 حفظ في السجل</button>
            </div>
        </div>
    </div>
</div>

<script>
const CONTRACTOR_CF_SHEET_READ_ID = "1xmSUQNR02prdGK9P6QiJo8ybVKwdVZAE74yUkUTbVYA";
const CONTRACTOR_CF_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrYHgPndRYq2YKAiBdEsRPM8SGEvrCBHEyTjhH5Ul4ER9keTCzZqoqTELLw1pEm2y1lQ/exec";

let _concfRowsCache = null;
let _concfEditingRow = null;
let map; let currentUser = { name: "Adming", isAdmin: true, role: "1" };
let allData = {}; let contractorMap = {};

function togglePasswordVisibility() {}
function doLogin() { document.getElementById("loginScreen").style.display = "none"; document.getElementById("mainApp").classList.add("visible"); }
function toggleReportsDropdown() {} function closeReportsDropdown() {}
function toggleAddDropdown() {} function closeAddDropdown() {}
function openEquipmentFormModal() {}
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function showAlert(msg, type) { console.log(type + ": " + msg); alert(msg); }

async function _cfFetchRows(sheetId) {
    const url = "https://docs.google.com/spreadsheets/d/" + sheetId + "/export?format=csv&gid=0";
    const r = await fetch(url);
    const csv = await r.text();
    const lines = csv.split('\\n');
    const headers = lines[0].split(',');
    const rows = [];
    for(let i=1; i<lines.length; i++) {
        if(!lines[i].trim()) continue;
        const vals = lines[i].split(',');
        const obj = {};
        headers.forEach((h, idx) => obj[h.trim()] = vals[idx]);
        obj['__rowIndex'] = i;
        rows.push(obj);
    }
    return { rows };
}

function _cfNextStatementNo(rows, noKey) {
    let maxNum = 0; let lastVal = '';
    rows.forEach(r => {
        const v = String(r[noKey]||'').trim();
        const n = parseInt(v.replace(/\\D/g, '')) || 0;
        if(n > maxNum){ maxNum = n; lastVal = v; }
    });
    const nextNum = maxNum ? maxNum + 1 : 1;
    return String(nextNum).padStart(3, '0');
}

async function openContractorCashflowForm() {
    openModal('contractorCashflowModal');
    document.getElementById('concf_date').value = new Date().toISOString().split('T')[0];
    concfSetMode('new');
    concfPopulateContractors();
    concfReset(true);
    try {
        const inp = document.getElementById('concf_statement_no');
        inp.value = ''; inp.placeholder = '⏳ جاري الجلب...';
        const { rows } = await _cfFetchRows(CONTRACTOR_CF_SHEET_READ_ID);
        _concfRowsCache = rows;
        inp.placeholder = 'اختر المقاول أولاً...';
    } catch(e) { document.getElementById('concf_statement_no').placeholder = 'حدث خطأ'; }
}

function closeContractorCashflowForm() { closeModal('contractorCashflowModal'); }

function concfPopulateContractors() {
    const sel = document.getElementById('concf_contractor_select');
    sel.innerHTML = '<option value="">-- اختر المقاول --</option><option value="مقاول أ">مقاول أ</option><option value="مقاول ب">مقاول ب</option>';
}

function concfSyncContractor(val) {
    document.getElementById('concf_contractor').value = val;
    const inp = document.getElementById('concf_statement_no');
    if (val && _concfRowsCache) {
        const cKey = Object.keys(_concfRowsCache[0]||{}).find(k=>/contractor|مقاول/i.test(k));
        const noKey = Object.keys(_concfRowsCache[0]||{}).find(k=>/statement|مستخلص|رقم/i.test(k));
        const contractorRows = _concfRowsCache.filter(r => (r[cKey]||'').trim() === val.trim());
        inp.value = _cfNextStatementNo(contractorRows, noKey);
        concfBuildHistory(_concfRowsCache, val);
    } else {
        inp.value = ''; inp.placeholder = 'اختر المقاول أولاً...';
        document.getElementById('concf_history_panel').style.display='none';
    }
}

function concfSetMode(mode) {
    const btn = document.getElementById('concf_submit_btn');
    const badge = document.getElementById('concf_edit_badge');
    if (mode === 'edit') {
        btn.textContent = '💾 حفظ التعديلات'; btn.style.background = 'linear-gradient(135deg,#2196f3,#1565c0)'; btn.style.color = 'white';
        badge.style.display = 'flex';
    } else {
        btn.textContent = '💾 حفظ في السجل'; btn.style.background = 'linear-gradient(135deg,#f5c842,#e8a800)'; btn.style.color = '#1a0a2e';
        badge.style.display = 'none';
    }
}

// THE FIX IS HERE
function concfLoadRowForEdit(rowJson) {
    const row = typeof rowJson === 'string' ? JSON.parse(rowJson) : rowJson;
    _concfEditingRow = row;
    concfSetMode('edit');
    const keys = Object.keys(row).filter(k => !k.startsWith('__'));
    const cKey     = keys.find(k => /contractor|مقاول/i.test(k))      || keys[0];
    const noKey    = keys.find(k => /statement|مستخلص|رقم/i.test(k))  || keys[1];
    const dateKey  = keys.find(k => /date|تاريخ/i.test(k))            || keys[2];
    
    const totalKey = keys.find(k => /total|إجمالي|المستحق|مستحق/i.test(k));
    const spentKey = keys.find(k => /spent|مصروف|مدفوع|المنصرف|منصرف/i.test(k));
    const notesKey = keys.find(k => /notes|ملاحظ/i.test(k));

    const cVal = row[cKey] || '';
    const sel  = document.getElementById('concf_contractor_select');
    if (sel) {
        if (![...sel.options].find(o=>o.value===cVal.trim()) && cVal) {
            const o = document.createElement('option'); o.value = cVal; o.textContent = cVal; sel.appendChild(o);
        }
        sel.value = cVal.trim();
    }
    document.getElementById('concf_contractor').value = cVal;
    document.getElementById('concf_statement_no').value = row[noKey] || '';
    document.getElementById('concf_date').value = row[dateKey] || '';

    // Handle extraction safely stripping commas so values populate in input
    if (totalKey) document.getElementById('concf_total').value = (row[totalKey] || '').replace(/,/g,'').trim();
    if (spentKey) document.getElementById('concf_spent').value = (row[spentKey] || '').replace(/,/g,'').trim();
    if (notesKey) document.getElementById('concf_notes').value = row[notesKey] || '';

    concfUpdatePreview();
    document.getElementById('concf_history_panel').style.display = 'none';
}

function concfBuildHistory(rows, filterContractor) {
    const list = document.getElementById('concf_history_list');
    let fRows = rows.slice();
    if(filterContractor) {
        const cKey = Object.keys(rows[0]||{}).find(k=>/contractor|مقاول/i.test(k));
        fRows = fRows.filter(r => (r[cKey]||'').trim() === filterContractor);
    }
    if(!fRows.length) return;
    const keys = Object.keys(fRows[0]).filter(k=>!k.startsWith('__'));
    const noKey = keys.find(k=>/statement|مستخلص|رقم/i.test(k));
    const dKey = keys.find(k=>/date|تاريخ/i.test(k));
    const tKey = keys.find(k=>/total|إجمالي|المستحق|مستحق/i.test(k));
    const cKey = keys.find(k=>/contractor|مقاول/i.test(k));

    list.innerHTML = fRows.slice().reverse().map((r,i) => {
        const bg = i%2===0 ? 'rgba(255,255,255,0.03)' : 'transparent';
        const num = r[noKey]||'-'; const dt = r[dKey]||'-';
        const tot = tKey ? r[tKey] : '-';
        return '<div onclick="concfLoadRowForEdit(\\'' + JSON.stringify(r).replace(/"/g,'&quot;') + '\\')" style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;background:'+bg+';color:#f5c842;display:flex;justify-content:space-between;font-size:12px;">' +
        '<span>' + num + '</span><span>' + dt + '</span><span>' + tot + '</span><span style="color:#5cc890">✎</span></div>';
    }).join('');
    document.getElementById('concf_history_panel').style.display = 'block';
}

function concfUpdatePreview() {
    const rawTot = document.getElementById('concf_total').value;
    const rawSpn = document.getElementById('concf_spent').value;
    const t = parseFloat(rawTot) || 0;
    const s = parseFloat(rawSpn) || 0;
    const r = Math.max(0, t - s);
    const p = document.getElementById('concf_preview');
    if (t > 0 || s > 0) {
        p.style.display = 'grid';
        document.getElementById('concf_prev_total').textContent = t.toLocaleString('en-US');
        document.getElementById('concf_prev_spent').textContent = s.toLocaleString('en-US');
        document.getElementById('concf_prev_remaining').textContent = r.toLocaleString('en-US');
    } else p.style.display = 'none';
}

function concfShowFeedback(msg, type) {
    const fb = document.getElementById('concf_feedback');
    fb.style.display = 'block'; fb.textContent = msg;
    fb.style.color = type === 'error' ? '#ff8a80' : '#5cc890';
}
function concfHideFeedback() { document.getElementById('concf_feedback').style.display='none'; }

function concfReset(keepDate = false) {
    document.getElementById('concf_contractor_select').value = '';
    document.getElementById('concf_contractor').value = '';
    const inp = document.getElementById('concf_statement_no');
    inp.value = ''; inp.placeholder = 'اختر المقاول أولاً...';
    document.getElementById('concf_total').value = '';
    document.getElementById('concf_spent').value = '';
    document.getElementById('concf_notes').value = '';
    if (!keepDate) document.getElementById('concf_date').value = new Date().toISOString().split('T')[0];
    document.getElementById('concf_preview').style.display = 'none';
    _concfEditingRow = null; concfSetMode('new');
    document.getElementById('concf_history_panel').style.display = 'none';
    concfHideFeedback();
}

async function concfSubmit() {
    concfHideFeedback();
    const c = document.getElementById('concf_contractor').value;
    const no = document.getElementById('concf_statement_no').value;
    const dt = document.getElementById('concf_date').value;
    const tot = document.getElementById('concf_total').value;
    const spn = document.getElementById('concf_spent').value;
    
    if(!c) return concfShowFeedback('اختر المقاول', 'error');
    if(!no) return concfShowFeedback('لا يوجد رقم للمستخلص', 'error');
    if(!tot) return concfShowFeedback('أدخل المستحق صرفه', 'error');

    const isEdit = !!_concfEditingRow;
    const btn = document.getElementById('concf_submit_btn');
    btn.textContent = '⏳ جاري الحفظ...'; btn.disabled = true;

    try {
        const r = await fetch(CONTRACTOR_CF_SCRIPT_URL, {
            method: 'POST', body: JSON.stringify({
                action: isEdit?'update':'insert', contractor:c, statement_no:no, date:dt, total:Number(tot), spent:Number(spn)
            })
        });
        if(r.ok) {
            concfShowFeedback('✅ تم الحفظ بنجاح', 'success');
            _concfRowsCache = null;
            setTimeout(() => concfReset(), 2000);
        } else throw new Error();
    } catch(e) { concfShowFeedback('❌ خطأ في الحفظ', 'error'); }
    finally { btn.disabled = false; btn.textContent = isEdit ? '💾 حفظ التعديلات' : '💾 حفظ في السجل'; }
}
</script>
