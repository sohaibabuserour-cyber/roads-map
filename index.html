<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الخريطة التفاعلية</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }

    .summary-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: #7a3fa0;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .summary-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 2px solid rgba(255,255,255,0.4);
      padding-bottom: 6px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }
    .summary-row:last-child { border-bottom: none; }

    .popup-card {
      width: 480px;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .popup-header {
      background: #7a3fa0;
      color: #fff;
      padding: 16px;
      text-align: center;
    }

    .title-main { font-size: 30px; font-weight: bold; }
    .title-sub { font-size: 22px; font-weight: bold; margin-top: 4px; }

    .popup-body { padding: 12px; font-size: 22px; }

    .popup-row {
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #e0e0e0;
    }
    .popup-row:last-child { border-bottom: none; }

    .popup-label { color: #7a3fa0; font-weight: bold; }
  </style>
</head>

<body>

<div class="summary-box">
  <div class="summary-title">إجماليات المشروع</div>
  <div class="summary-row"><span>إجمالي الردم الكلي</span><span id="fillTotal">0</span></div>
  <div class="summary-row"><span>إجمالي القطع الكلي</span><span id="cutTotal">0</span></div>
  <div class="summary-row"><span>الردم المنفذ</span><span id="fillDone">0</span></div>
  <div class="summary-row"><span>القطع المنفذ</span><span id="cutDone">0</span></div>
  <div class="summary-row"><span>الردم المتبقي</span><span id="fillRemain">0</span></div>
  <div class="summary-row"><span>القطع المتبقي</span><span id="cutRemain">0</span></div>
</div>

<div id="map"></div>

<script>
const map = L.map('map', { zoomControl: false }).setView([21.30,39.70],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

/* ✅ دالة التلوين */
function getColorByStatus(status) {
  if (!status) return "#9e9e9e";
  status = status.trim();
  if (status === "جاري") return "#4caf50";
  if (status === "منتهي") return "#2196f3";
  if (status === "متوقف") return "#f44336";
  return "#9e9e9e";
}

let userMarker=null;
if("geolocation" in navigator){
  navigator.geolocation.watchPosition(p=>{
    if(userMarker) map.removeLayer(userMarker);
    userMarker=L.circleMarker([p.coords.latitude,p.coords.longitude],{
      radius:8,color:"#1e88e5",fillColor:"#2196f3",fillOpacity:1,weight:3
    }).addTo(map);
  });
}

/* ===== قراءة Google Sheet ===== */
function num(v){ return !isNaN(v)&&v!==""?Number(v):0;}
const sheetURL="https://docs.google.com/spreadsheets/d/1uEMaen3ZKZdQh2_d0M5sQ93XXXAl8SJm1AHkKnO3RPA/gviz/tq?tqx=out:json";

fetch(sheetURL).then(r=>r.text()).then(t=>{
  const js=JSON.parse(t.substring(47).slice(0,-2));
  const data={};

  js.table.rows.forEach(r=>{
    if(!r.c[0]) return;
    data[String(r.c[0].v)]={};
    js.table.cols.forEach((c,i)=>{
      data[String(r.c[0].v)][c.label]=r.c[i]&&r.c[i].v!==null?r.c[i].v:"";
    });
  });

  fetch("https://sohaibabuserour-cyber.github.io/roads-map/ROADS.geojson")
  .then(r=>r.json()).then(geo=>{
    const layer=L.geoJSON(geo,{
      onEachFeature:(f,l)=>{
        const row=data[String(f.properties.Name)];
        if(!row) return;

        const color=getColorByStatus(row["STATUS"]);
        l.setStyle({color,fillColor:color,fillOpacity:0.5,weight:3});

        let html=`<div class="popup-card"><div class="popup-header">
        <div class="title-main">مشروع ولي العهد 9‑ي</div>
        <div class="title-sub">بيانات الطرق</div></div><div class="popup-body">`;

        Object.keys(row).forEach(k=>{
          if(k==="Name") return;
          html+=`<div class="popup-row"><div class="popup-label">${k}</div><div>${row[k]}</div></div>`;
        });

        l.bindPopup(html+"</div></div>");
      }
    }).addTo(map);

    map.fitBounds(layer.getBounds());
  });
});
</script>
</body>
</html>
